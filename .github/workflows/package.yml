name: Verify npm package

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - src/**
      - .github/workflows/package.yml
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - src/**
      - .github/workflows/package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Verify public-package metadata
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const expectedFiles = ['dist/stdio.js', 'dist/server.js', 'dist/work-contract.js', 'dist/public-engineering.js', 'dist/tailored-guidance.js', 'dist/decision-support.js', 'dist/agent-trajectory.js', 'dist/change-impact.js', 'dist/mcp-contract-audit.js', 'dist/instruction-audit.js', 'dist/adversarial-planning.js', 'dist/quality-view.js', 'dist/codexify-evidence.js', 'dist/codexify-host-audit.js', 'dist/codexify-checkpoint.js', 'dist/skill-content.js', 'dist/skills.js', 'dist/content.js', 'bin/godprompt-proof.mjs', 'bin/godprompt-repo-map.mjs', 'README.md', 'LICENSE'];
          if (pkg.name !== 'god-prompt-mcp') throw new Error('package name drift');
          const serverSource = require('fs').readFileSync('src/server.ts', 'utf8');
          const match = serverSource.match(/version:\s*"([^"]+)"/);
          if (!match || match[1] !== pkg.version) throw new Error('package/server version drift');
          if (pkg.private !== false) throw new Error('package must be explicitly public');
          if (pkg.publishConfig?.access !== 'public') throw new Error('publishConfig.access must be public');
          if (pkg.publishConfig?.registry !== 'https://registry.npmjs.org/') throw new Error('publishConfig.registry drift');
          if (JSON.stringify(pkg.files) !== JSON.stringify(expectedFiles)) throw new Error('npm files allowlist drift');
          if (pkg.bin?.['god-prompt-mcp'] !== 'dist/stdio.js') throw new Error('stdio binary drift');
          if (pkg.bin?.['godprompt-repo-map'] !== 'bin/godprompt-repo-map.mjs') throw new Error('repo-map binary drift');
          NODE

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Pack and audit file list
        id: pack
        shell: bash
        run: |
          npm pack --json > "${RUNNER_TEMP}/npm-pack.json"
          TARBALL="$(node -p "require('${RUNNER_TEMP}/npm-pack.json')[0].filename")"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          node - <<'NODE'
          const pack = require(process.env.RUNNER_TEMP + '/npm-pack.json')[0];
          const names = new Set(pack.files.map((f) => f.path));
          const required = ['package.json', 'README.md', 'LICENSE', 'dist/stdio.js', 'dist/server.js', 'dist/work-contract.js', 'dist/skill-content.js', 'dist/skills.js', 'dist/content.js', 'dist/quality-view.js', 'bin/godprompt-repo-map.mjs'];
          for (const file of required) {
            if (!names.has(file)) throw new Error(`missing packaged file: ${file}`);
          }
          for (const file of names) {
            if (/^(src|tests|\.github)\//.test(file)) throw new Error(`development file leaked into package: ${file}`);
            if (file === 'dist/index.js') throw new Error('Cloudflare Worker entry leaked into stdio npm package');
          }
          NODE

      - name: Install packed package in a clean project
        shell: bash
        run: |
          APP="${RUNNER_TEMP}/god-prompt-npm-smoke"
          mkdir -p "$APP"
          cd "$APP"
          npm init -y >/dev/null
          npm install --ignore-scripts "${GITHUB_WORKSPACE}/${{ steps.pack.outputs.tarball }}"

      - name: Smoke test installed optional local proof CLI (read-only)
        shell: bash
        run: |
          APP="$RUNNER_TEMP/god-prompt-npm-smoke"
          OUTPUT="$RUNNER_TEMP/godprompt-proof-smoke.json"
          export GODPROMPT_FEEDBACK_FILE="$RUNNER_TEMP/godprompt-proof-not-created.jsonl"
          node "$APP/node_modules/god-prompt-mcp/bin/godprompt-proof.mjs" lessons --project packaging-smoke > "$OUTPUT"
          node - "$OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (result.scope !== 'local_only' || result.records !== 0) {
            throw new Error('proof CLI smoke result mismatch');
          }
          NODE
          test ! -e "$GODPROMPT_FEEDBACK_FILE"

      - name: Verify installed MCP tool surface
        shell: bash
        run: |
          APP="${RUNNER_TEMP}/god-prompt-npm-smoke"
          cd "$APP"
          node <<'NODE'
          const { spawn } = require('node:child_process');
          const path = require('node:path');

          const bin = path.join(process.cwd(), 'node_modules', '.bin', 'god-prompt-mcp');
          const child = spawn(bin, [], { stdio: ['pipe', 'pipe', 'inherit'] });
          let buffer = '';
          let nextId = 1;
          const pending = new Map();

          const timeout = setTimeout(() => {
            child.kill('SIGKILL');
            throw new Error('MCP smoke test timed out');
          }, 15000);

          child.stdout.setEncoding('utf8');
          child.stdout.on('data', (chunk) => {
            buffer += chunk;
            for (;;) {
              const newline = buffer.indexOf('\n');
              if (newline < 0) break;
              const line = buffer.slice(0, newline).trim();
              buffer = buffer.slice(newline + 1);
              if (!line) continue;
              const message = JSON.parse(line);
              if (message.id != null && pending.has(message.id)) {
                pending.get(message.id)(message);
                pending.delete(message.id);
              }
            }
          });

          function send(message) {
            child.stdin.write(JSON.stringify(message) + '\n');
          }

          function request(method, params) {
            const id = nextId++;
            return new Promise((resolve) => {
              pending.set(id, resolve);
              send({ jsonrpc: '2.0', id, method, params });
            });
          }

          (async () => {
            const init = await request('initialize', {
              protocolVersion: '2025-11-25',
              capabilities: {},
              clientInfo: { name: 'npm-smoke', version: '1.0' },
            });
            if (!init.result) throw new Error('initialize failed');
            send({ jsonrpc: '2.0', method: 'notifications/initialized', params: {} });
            const listed = await request('tools/list', {});
            const names = (listed.result?.tools ?? []).map((tool) => tool.name).sort();
            const expected = [
              'audit_agent_instructions',
              'audit_agent_trajectory',
              'audit_requirements',
              'design_adversarial_tests',
              'assess_release_readiness',
              'build_test_matrix',
              'classify_task',
              'compare_evaluation_runs',
              'create_context_handoff',
              'create_work_contract',
              'diagnose_failure',
              'review_work_evidence',
              'get_anti_patterns',
              'get_core_skill',
              'get_gates',
              'get_god_prompt',
              'get_protocols',
              'get_tailored_guidance',
              'get_version',
              'review_code_change',
              'review_mcp_tool_contracts',
              'trace_change_impact',
            ].sort();
            if (JSON.stringify(names) !== JSON.stringify(expected)) {
              throw new Error(`tool surface mismatch: ${JSON.stringify(names)}`);
            }
            clearTimeout(timeout);
            child.stdin.end();
            child.kill('SIGTERM');
          })().catch((error) => {
            clearTimeout(timeout);
            child.kill('SIGKILL');
            console.error(error);
            process.exit(1);
          });
          NODE

  ubuntu26-compatibility:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify package can be created
        run: npm pack --dry-run
