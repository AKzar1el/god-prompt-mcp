name: Build MCPB bundle

on:
  pull_request:
    paths:
      - manifest.json
      - .mcpbignore
      - package.json
      - package-lock.json
      - src/**
      - tests/**
      - scripts/normalize-mcpb.mjs
      - assets/logo-400.png
      - .github/workflows/publish-mcpb.yml

permissions:
  contents: read

jobs:
  build:
    name: Validate and pack MCPB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build stdio server
        run: npm run build

      - name: Validate MCPB manifest
        run: npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json

      - name: Prepare audited local runtime dependencies
        run: |
          npm pkg delete dependencies.agents
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm prune --omit=dev --ignore-scripts
          npm audit fix --omit=dev --ignore-scripts
          npm audit --omit=dev --audit-level=high
          test ! -d node_modules/agents
          node --input-type=module -e "await import('@modelcontextprotocol/sdk/server/stdio.js'); await import('./dist/server.js')"

      - name: Pack deterministic MCPB
        run: |
          npx -y @anthropic-ai/mcpb@2.1.2 pack . first.mcpb
          node scripts/normalize-mcpb.mjs first.mcpb
          sleep 2
          npx -y @anthropic-ai/mcpb@2.1.2 pack . second.mcpb
          node scripts/normalize-mcpb.mjs second.mcpb
          cmp -s first.mcpb second.mcpb
          unzip -t first.mcpb
          mv first.mcpb god-prompt-mcp-1.0.2.mcpb

      - name: Verify bundle contents and hash
        run: |
          unzip -Z1 god-prompt-mcp-1.0.2.mcpb > "${RUNNER_TEMP}/mcpb-files.txt"
          grep -Fx 'manifest.json' "${RUNNER_TEMP}/mcpb-files.txt"
          grep -Fx 'dist/stdio.js' "${RUNNER_TEMP}/mcpb-files.txt"
          grep -Fx 'assets/logo-400.png' "${RUNNER_TEMP}/mcpb-files.txt"
          grep -q '^node_modules/' "${RUNNER_TEMP}/mcpb-files.txt"
          if grep -Eq '^(src|tests|\.github)/' "${RUNNER_TEMP}/mcpb-files.txt"; then
            echo '::error::Development-only files leaked into the MCPB bundle.'
            exit 1
          fi
          if grep -Eq '^(dist/index\.js|node_modules/agents/)' "${RUNNER_TEMP}/mcpb-files.txt"; then
            echo '::error::Remote Worker-only runtime leaked into the local MCPB bundle.'
            exit 1
          fi
          EXPECTED_SHA='d02c3eadda48d80fc87192bc2a24211a1d988db3a0b335c893d08ae00652a8c6'
          ACTUAL_SHA="$(sha256sum god-prompt-mcp-1.0.2.mcpb | cut -d' ' -f1)"
          echo "Expected MCPB SHA-256: $EXPECTED_SHA"
          echo "Actual MCPB SHA-256:   $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          printf '%s  %s\n' "$ACTUAL_SHA" 'god-prompt-mcp-1.0.2.mcpb'

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: god-prompt-mcp-1.0.2-mcpb
          path: god-prompt-mcp-1.0.2.mcpb
          if-no-files-found: error
