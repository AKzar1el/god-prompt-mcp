name: Verify MCP Server

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test stdio MCP
        run: npm test

      - name: Verify modern stdio with MCP Inspector
        if: matrix.node-version == '24'
        run: npx -y @modelcontextprotocol/inspector@2.7.0 --cli node dist/stdio.js --protocol-era modern --method tools/list --format json
