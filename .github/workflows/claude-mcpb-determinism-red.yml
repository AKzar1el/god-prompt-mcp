name: MCPB determinism regression

on:
  push:
    branches:
      - chore/claude-desktop-directory
    paths:
      - .github/workflows/claude-mcpb-determinism-red.yml

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Prepare audited local runtime dependencies
        run: |
          npm pkg delete dependencies.agents
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm prune --omit=dev --ignore-scripts
          npm audit fix --omit=dev --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Prove two official packs are not byte-identical
        run: |
          npx -y @anthropic-ai/mcpb@2.1.2 pack . first.mcpb
          sleep 2
          npx -y @anthropic-ai/mcpb@2.1.2 pack . second.mcpb
          sha256sum first.mcpb second.mcpb
          cmp -s first.mcpb second.mcpb
