name: Claude MCPB production dependency audit

on:
  push:
    branches:
      - chore/claude-desktop-directory
    paths:
      - .github/workflows/claude-security-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high
