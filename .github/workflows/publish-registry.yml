name: Publish to MCP Registry

on:
  pull_request:
    paths:
      - server.json
      - .github/workflows/publish-registry.yml
  push:
    branches:
      - main
    paths:
      - server.json
      - .github/workflows/publish-registry.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate Registry metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify MCPB release metadata
        run: |
          node - <<'NODE'
          const server = require('./server.json');
          const expected = {
            registryType: 'mcpb',
            identifier: 'https://github.com/AKzar1el/god-prompt-mcp/releases/download/v1.0.0/god-prompt-mcp-1.0.0.mcpb',
            fileSha256: 'ce6f7adbebe2854cce8b6f4233d77c07e21c104719779908fd56d14a3d098c7e',
            transport: { type: 'stdio' },
          };
          if (server.name !== 'io.github.AKzar1el/god-prompt-mcp') throw new Error('Registry name drift');
          if (JSON.stringify(server.packages?.[0]) !== JSON.stringify(expected)) throw new Error('MCPB metadata drift');
          NODE

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

  publish:
    name: Publish to official MCP Registry
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish server.json
