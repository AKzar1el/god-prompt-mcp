name: Publish to MCP Registry

on:
  pull_request:
    paths:
      - server.json
      - manifest.json
      - package.json
      - package-lock.json
      - .mcpbignore
      - .github/workflows/publish-registry.yml
  push:
    branches:
      - main
    paths:
      - server.json
      - .github/workflows/publish-registry.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate Registry metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify MCPB release metadata
        run: |
          node - <<'NODE'
          const server = require('./server.json');
          const manifest = require('./manifest.json');
          const pkg = require('./package.json');
          const version = pkg.version;
          if (server.name !== 'io.github.AKzar1el/god-prompt-mcp') throw new Error('Registry name drift');
          if (server.version !== version || manifest.version !== version) throw new Error('version metadata drift');
          const expectedIdentifier = `https://github.com/AKzar1el/god-prompt-mcp/releases/download/v${version}/god-prompt-mcp-${version}.mcpb`;
          const artifact = server.packages?.[0];
          if (artifact?.registryType !== 'mcpb') throw new Error('Registry package type drift');
          if (artifact.identifier !== expectedIdentifier) throw new Error('MCPB release URL drift');
          if (!/^[a-f0-9]{64}$/.test(artifact.fileSha256 ?? '')) throw new Error('MCPB SHA-256 is missing or invalid');
          if (JSON.stringify(artifact.transport) !== JSON.stringify({ type: 'stdio' })) throw new Error('MCPB transport drift');
          NODE

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

  release-mcpb:
    name: Release verified MCPB artifact
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build stdio server
        run: npm run build

      - name: Validate MCPB manifest
        run: npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json

      - name: Prepare audited local runtime dependencies
        run: |
          npm pkg delete dependencies.agents
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm prune --omit=dev --ignore-scripts
          npm audit fix --omit=dev --ignore-scripts
          npm audit --omit=dev --audit-level=high
          test ! -d node_modules/agents
          node --input-type=module -e "await import('@modelcontextprotocol/sdk/server/stdio.js'); await import('./dist/server.js')"

      - name: Pack and verify MCPB
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          ASSET="god-prompt-mcp-${VERSION}.mcpb"
          npx -y @anthropic-ai/mcpb@2.1.2 pack . "$ASSET"
          ACTUAL_SHA="$(sha256sum "$ASSET" | cut -d' ' -f1)"
          EXPECTED_SHA="$(node -p "require('./server.json').packages[0].fileSha256")"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          unzip -Z1 "$ASSET" > "${RUNNER_TEMP}/mcpb-files.txt"
          grep -Fx 'manifest.json' "${RUNNER_TEMP}/mcpb-files.txt"
          grep -Fx 'dist/stdio.js' "${RUNNER_TEMP}/mcpb-files.txt"
          grep -Fx 'assets/logo-400.png' "${RUNNER_TEMP}/mcpb-files.txt"
          grep -q '^node_modules/' "${RUNNER_TEMP}/mcpb-files.txt"
          if grep -Eq '^(src|tests|\.github)/' "${RUNNER_TEMP}/mcpb-files.txt"; then
            echo '::error::Development-only files leaked into the MCPB bundle.'
            exit 1
          fi
          if grep -Eq '^(dist/index\.js|node_modules/agents/)' "${RUNNER_TEMP}/mcpb-files.txt"; then
            echo '::error::Remote Worker-only runtime leaked into the local MCPB bundle.'
            exit 1
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          ASSET="god-prompt-mcp-${VERSION}.mcpb"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "GodPrompt MCP ${VERSION}: Claude Desktop/MCPB metadata and compatibility release."
          fi

  publish:
    name: Publish to official MCP Registry
    if: github.event_name == 'push'
    needs: release-mcpb
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify published release asset hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          ASSET="god-prompt-mcp-${VERSION}.mcpb"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "${RUNNER_TEMP}"
          ACTUAL_SHA="$(sha256sum "${RUNNER_TEMP}/${ASSET}" | cut -d' ' -f1)"
          EXPECTED_SHA="$(node -p "require('./server.json').packages[0].fileSha256")"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish server.json
