name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify release version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "v${VERSION}" = "${{ github.event.release.tag_name }}"
          node - <<'NODE'
          const [major, minor] = process.env.npm_config_user_agent.match(/npm\/(\d+)\.(\d+)/).slice(1).map(Number);
          if (major < 11 || (major === 11 && minor < 5)) {
            throw new Error('npm >= 11.5.1 is required for trusted publishing');
          }
          NODE

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - run: npm publish
