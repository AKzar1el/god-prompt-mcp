name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify release and npm versions
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "v${VERSION}" = "${{ github.event.release.tag_name }}"
          NPM_VERSION="$(npm --version)"
          node - "$NPM_VERSION" <<'NODE'
          const [major, minor, patch] = process.argv[2].split('.').map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            throw new Error(`npm >= 11.5.1 is required for trusted publishing; found ${process.argv[2]}`);
          }
          NODE

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - run: npm publish
