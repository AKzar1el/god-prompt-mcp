name: Prepare Claude-compatible MCP SDK

on:
  push:
    branches:
      - chore/claude-desktop-directory
    paths:
      - .github/workflows/claude-sdk-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/claude-desktop-directory

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Upgrade supported v1 SDK and bundle version
        run: |
          npm install --save-exact @modelcontextprotocol/sdk@1.29.0
          npm version 1.0.1 --no-git-tag-version
          node - <<'NODE'
          const pkg = require('./package.json');
          if (pkg.version !== '1.0.1') throw new Error('package version drift');
          if (pkg.dependencies['@modelcontextprotocol/sdk'] !== '1.29.0') throw new Error('SDK version drift');
          const lock = require('./package-lock.json');
          if (lock.packages[''].version !== '1.0.1') throw new Error('lockfile root version drift');
          if (lock.packages[''].dependencies['@modelcontextprotocol/sdk'] !== '1.29.0') throw new Error('lockfile SDK range drift');
          NODE
          git diff --check -- package.json package-lock.json

      - name: Commit package metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --stat
          git commit -m "chore: update MCP SDK for Claude metadata"
          git push origin HEAD:chore/claude-desktop-directory
