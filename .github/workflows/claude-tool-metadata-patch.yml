name: Apply Claude tool metadata patch

on:
  push:
    branches:
      - chore/claude-desktop-directory
    paths:
      - .github/workflows/claude-tool-metadata-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/claude-desktop-directory

      - name: Add tool titles and read-only annotations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/server.ts')
          text = path.read_text()

          old_info = '''export const SERVER_INFO = {\n  name: "god-prompt-mcp",\n  version: VERSION,\n} as const;'''
          new_info = '''export const SERVER_INFO = {\n  name: "god-prompt-mcp",\n  version: "1.0.1",\n} as const;'''
          if text.count(old_info) != 1:
              raise SystemExit('SERVER_INFO baseline drift')
          text = text.replace(old_info, new_info, 1)

          anchor = '''const CORE_SKILL = CONTENT.CORE_SKILL\n  .replaceAll("core/01-PROTOCOLS.md", "references/01-PROTOCOLS.md")\n  .replaceAll("core/02-GATES.md", "references/02-GATES.md")\n  .replaceAll("core/03-ANTI-PATTERNS.md", "references/03-ANTI-PATTERNS.md");'''
          annotations = anchor + '''\n\nconst READ_ONLY_ANNOTATIONS = {\n  readOnlyHint: true,\n  destructiveHint: false,\n  idempotentHint: true,\n  openWorldHint: false,\n} as const;'''
          if text.count(anchor) != 1:
              raise SystemExit('CORE_SKILL anchor drift')
          text = text.replace(anchor, annotations, 1)

          titles = {
              'get_god_prompt': 'Get full GodPrompt',
              'get_core_skill': 'Get core GodPrompt skill',
              'get_protocols': 'Get GodPrompt protocols',
              'get_gates': 'Get GodPrompt verification gates',
              'get_anti_patterns': 'Get GodPrompt anti-patterns',
              'get_version': 'Get GodPrompt version',
          }

          for name, title in titles.items():
              pattern = re.compile(
                  rf'''  server\.tool\(\n    "{re.escape(name)}",\n    (?P<description>(?:`[^`]*`|"[^"]*")),\n    \{{\}},\n    async'''
              )
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f'expected one legacy registration for {name}, found {len(matches)}')
              description = matches[0].group('description')
              replacement = (
                  f'  server.registerTool(\n'
                  f'    "{name}",\n'
                  f'    {{\n'
                  f'      title: "{title}",\n'
                  f'      description: {description},\n'
                  f'      annotations: READ_ONLY_ANNOTATIONS,\n'
                  f'    }},\n'
                  f'    async'
              )
              text = text[:matches[0].start()] + replacement + text[matches[0].end():]

          pattern = re.compile(
              r'''  server\.tool\(\n    "classify_task",\n    (?P<description>"[^"]*"),\n    (?P<schema>\{\n      description: z.*?\n    \}),\n    async''',
              re.S,
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'expected one classify_task legacy registration, found {len(matches)}')
          description = matches[0].group('description')
          schema = matches[0].group('schema')
          replacement = (
              '  server.registerTool(\n'
              '    "classify_task",\n'
              '    {\n'
              '      title: "Classify software-development task",\n'
              f'      description: {description},\n'
              f'      inputSchema: {schema},\n'
              '      annotations: READ_ONLY_ANNOTATIONS,\n'
              '    },\n'
              '    async'
          )
          text = text[:matches[0].start()] + replacement + text[matches[0].end():]

          if 'server.tool(' in text:
              raise SystemExit('legacy tool registration remains')
          if text.count('server.registerTool(') != 7:
              raise SystemExit('expected seven registerTool calls')

          path.write_text(text)
          PY
          git diff --check -- src/server.ts
          git diff --stat -- src/server.ts

      - name: Commit source-only patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts
          git commit -m "feat: expose Claude directory tool metadata"
          git push origin HEAD:chore/claude-desktop-directory
