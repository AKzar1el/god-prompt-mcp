name: Publish v1.0.0 Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v1.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; nothing to do."
            exit 0
          fi

          gh release create v1.0.0 \
            --target 3c7bad2fc97625409f66c420bf77a28aafc33a61 \
            --title "v1.0.0" \
            --notes "Initial stable release of the GodPrompt MCP Server. Includes the seven GodPrompt tools, Cloudflare Workers remote transport, Glama-compatible stdio transport, build verification, Glama metadata, and MIT licensing."
